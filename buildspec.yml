version: 0.2

env:
  variables:
    AWS_REGION: ap-northeast-1
    AWS_ACCOUNT_ID: "665511042038"

phases:

  install:
    runtime-versions:
      python: 3.12

    commands:
      - echo "=== Install dependencies ==="
      - python --version
      - pip --version
      - pip install --upgrade pip
      - pip install pytest

  pre_build:
    commands:

      - echo "=== Run unit tests ==="
      - pytest -v

      - echo "=== Login to Amazon ECR ==="
      - aws --version

      - |
        aws ecr get-login-password \
          --region "$AWS_REGION" \
          | docker login \
          --username AWS \
          --password-stdin \
          "$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"

  build:
    commands:

      - echo "=== Docker build ==="

      - |
        REPOSITORY_URI="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com/$ECR_REPOSITORY"

        IMAGE_TAG=$(echo "$CODEBUILD_RESOLVED_SOURCE_VERSION" | cut -c 1-40)

        if [ -z "$IMAGE_TAG" ]; then
          IMAGE_TAG="$CODEBUILD_BUILD_NUMBER"
        fi

        echo "REPOSITORY_URI=$REPOSITORY_URI"
        echo "IMAGE_TAG=$IMAGE_TAG"

        docker build \
          -t "$REPOSITORY_URI:$IMAGE_TAG" \
          .

        docker push \
          "$REPOSITORY_URI:$IMAGE_TAG"

        printf '[{"name":"%s","imageUri":"%s"}]' \
          "$CONTAINER_NAME" \
          "$REPOSITORY_URI:$IMAGE_TAG" \
          > imagedefinitions.json

        echo "=== imagedefinitions.json ==="
        cat imagedefinitions.json

artifacts:
  files:
    - imagedefinitions.json
